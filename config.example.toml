# Copy to models.toml. Keep secrets in environment variables, never in this file.
# Configure five distinct model identifiers. base_url is the provider's API root.

[[models]]
id = "analyst-a"
model = "provider/model-a"
base_url = "https://api.example.org/v1"
api_key_env = "QUELLENLOT_KEY_A"

