name: Python quality

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and strict checkers
        id: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Full repository quality gates
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Validate private deployment Compose configuration
        env:
          QUELLENLOT_DOMAIN: facts.example.org
          QUELLENLOT_PASSWORD_HASH: placeholder-for-syntax-check
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Behavioral tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m unittest discover -s tests -v
      - name: Dependency vulnerability audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pip-audit
      - name: Build and validate distribution
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m build && twine check dist/*
