name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and strict checkers
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Prepare pinned checker wheels for migration diagnostics
        run: python -m pip download --dest "$RUNNER_TEMP/quality-wheels" ruff==0.17.2 ty==0.0.91 pyright==1.1.414 crosshair-tool==0.0.112 import-linter==2.15 vulture==2.16
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-checker-wheels
          path: ${{ runner.temp }}/quality-wheels
          retention-days: 1
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Strict Pyright
        run: pyright
      - name: Behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Bandit security scan
        run: bandit -r src -ll
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Build and validate distribution
        run: python -m build && twine check dist/*
