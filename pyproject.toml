[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quellenlot-agents"
version = "0.1.0"
description = "Evidence-first multi-model claim review core for Quellenlot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "build==1.2.2",
  "pip-audit==2.9.0",
  "pre-commit==4.2.0",
  "pyright==1.1.399",
  "ruff==0.11.13",
  "twine==6.1.0",
]

[project.scripts]
quellenlot-agents = "quellenlot_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
respect-gitignore = true

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FURB",
  "G",
  "I",
  "LOG",
  "PERF",
  "PIE",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TRY",
  "UP",
  "W",
  "D100",
  "D101",
  "D102",
  "D103",
  "D107",
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportAny = "error"
reportExplicitAny = "error"
reportMissingTypeStubs = "error"
